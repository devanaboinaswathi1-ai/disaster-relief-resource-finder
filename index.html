<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Disaster Relief Resource Finder</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="css/style.css?v=2.0" />
  </head>
  <body>
    <header class="topbar">
      <h1>Disaster Relief Resource Finder</h1>
      <nav>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main class="layout">
      <section class="controls">
        <label>
          Location:
          <select id="locationFilter">
            <option value="">Select Location</option>
            <option value="16.5062,80.6480">Vijayawada</option>
            <option value="16.1875,81.1389">Machilipatnam</option>
            <option value="16.3067,80.4365">Guntur</option>
            <option value="17.6869,83.2185">Visakhapatnam (Vizag)</option>
            <option value="18.1124,83.4125">Vizianagaram</option>
            <option value="17.3850,78.4867">Hyderabad</option>
            <option value="28.6139,77.2090">Delhi</option>
            <option value="19.0760,72.8777">Mumbai</option>
            <option value="13.0827,80.2707">Chennai</option>
            <option value="12.9716,77.5946">Bangalore</option>
          </select>
        </label>
        <label>
          Type:
          <select id="typeFilter">
            <option value="">All</option>
            <option value="shelter">Shelter</option>
            <option value="food">Food</option>
            <option value="medical">Medical</option>
            <option value="water">Water</option>
          </select>
        </label>
        <label>
          Radius (km):
          <input id="radiusInput" type="number" min="1" max="100" value="10" />
        </label>
        <button id="locateBtn">Use My Location</button>
        <button id="searchBtn">Search</button>
        <span id="status" class="status"></span>
      </section>

      <section class="map-and-list">
        <div id="map" class="map"></div>
        <aside class="list" id="list"></aside>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/app.js"></script>
  </body>
  </html>
